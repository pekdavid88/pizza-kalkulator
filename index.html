<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NY Pizza Tésztakalkulátor - Hosszú Sütési Ablak</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f97316;
      --accent-hover: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--accent);
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .val-display {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    input[type="number"],
    input[type="range"] {
      width: 100%;
    }

    input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .info-box {
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 24px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .info-box strong {
      color: var(--text);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    td.pct {
      text-align: right;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
    }

    tr.total-row td {
      border-bottom: none;
      border-top: 2px solid var(--border);
      font-weight: 700;
      color: var(--accent);
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>NY Pizza Kalkulátor</h1>
    <p class="subtitle">Magas stabilitású receptúra hosszú szobahőmérsékletű tartáshoz</p>

    <!-- Pizzák darabszáma -->
    <div class="form-group">
      <label for="numPizzas">Pizzák darabszáma: <span class="val-display" id="numPizzasDisplay">5 db</span></label>
      <input type="number" id="numPizzas" min="1" max="200" value="5">
    </div>

    <!-- Egy pizza súlya -->
    <div class="form-group">
      <label for="weightPerBall">Egy tésztagombóc súlya: <span class="val-display" id="weightDisplay">300 g</span></label>
      <input type="number" id="weightPerBall" min="150" max="600" step="10" value="300">
    </div>

    <!-- Érlelési idő csúszka -->
    <div class="form-group">
      <label for="fermentTime">Érlelési idő: <span class="val-display" id="timeDisplay">24 óra</span></label>
      <input type="range" id="fermentTime" min="2" max="72" step="1" value="24">
    </div>

    <!-- Technológiai visszajelzés -->
    <div class="info-box" id="processNotes">
      Betöltés...
    </div>

    <!-- Receptúratábla -->
    <table>
      <thead>
        <tr>
          <th>Alapanyag</th>
          <th style="text-align: right;">Arányok</th>
          <th style="text-align: right;">Mennyiség</th>
        </tr>
      </thead>
      <tbody id="ingredientsBody">
        <!-- JS generálja -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td>Össztömeg</td>
          <td class="pct" id="totalPct">-</td>
          <td class="num" id="totalWeight">-</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    const inputs = {
      numPizzas: document.getElementById('numPizzas'),
      weightPerBall: document.getElementById('weightPerBall'),
      fermentTime: document.getElementById('fermentTime')
    };

    const displays = {
      numPizzas: document.getElementById('numPizzasDisplay'),
      weight: document.getElementById('weightDisplay'),
      time: document.getElementById('timeDisplay'),
      notes: document.getElementById('processNotes'),
      body: document.getElementById('ingredientsBody'),
      totalPct: document.getElementById('totalPct'),
      totalWeight: document.getElementById('totalWeight')
    };

    function calculateParameters(hours) {
      let yeastPct = 0.12;
      let sugarPct = 1.0;
      let hydration = 60.0;
      let saltPct = 2.9;
      let oilPct = 2.5;
      let tempDesc = "";
      let methodDesc = "";

      if (hours <= 4) {
        // Expressz kelesztés szobahőn
        yeastPct = 1.2 - (hours - 2) * 0.25;
        sugarPct = 1.8;
        hydration = 61.0;
        saltPct = 2.6;
        tempDesc = "Kézmeleg víz (30–34 °C)";
        methodDesc = "<strong>Szobahőmérsékletű gyorsérlelés:</strong> Meleg vizet használj. Dagasztás után 15 perc pihentetés, majd gombócozás és szobahőn (22–24 °C) kelesztés sütésig.";
      } else if (hours <= 8) {
        // Napközbeni szobahő
        yeastPct = 0.45 - (hours - 4) * 0.06;
        sugarPct = 1.5;
        hydration = 60.5;
        saltPct = 2.8;
        tempDesc = "Szobahőmérsékletű víz (18–20 °C)";
        methodDesc = "<strong>Napközbeni kelesztés:</strong> 1-2 óra bulk kelesztés után gombócozd feszesre, majd lefedett kelesztődobozban tartsd szobahőn.";
      } else if (hours <= 28) {
        // 24 órás hűtős fermentáció – 16:00/17:00 és 20:00 közötti sütési ablakra optimalizálva
        yeastPct = 0.12;
        sugarPct = 1.0;
        hydration = 60.0;
        saltPct = 2.9;
        tempDesc = "Jéghideg víz (4–8 °C)";
        methodDesc = "<strong>24 órás hideg fermentáció (5 órás pult-stabilitás):</strong> Dagasztás után 15 perc pihentetés, majd mehet egyben (bulk) a hűtőbe (3–4 °C). <em>A sütés előtt 1,5–2 órával (kb. 14:30–15:00 körül) egyszerre gombócozd ki az összes bucit nagyon feszesre. Zárt dobozban tartva a tészta 16:30-tól egészen 20:00-ig süthető és feszes marad anélkül, hogy szakaszosan kellene hűteni.</em>";
      } else {
        // Hosszú 28-72 órás hideg fermentáció
        yeastPct = 0.08 - ((hours - 28) / 44) * 0.03;
        sugarPct = 0.8;
        hydration = 60.0;
        saltPct = 3.0;
        tempDesc = "Jéghideg víz (3–5 °C)";
        methodDesc = "<strong>Hosszú hideg érlelés (3–4 °C):</strong> Lassú enzimatikus cukorbontás és masszív sikérszerkezet. A tésztát bulk formában hűtsd, majd a sütés előtt 2 órával feszesen gombócozd ki.";
      }

      return {
        flour: 100.0,
        water: hydration,
        salt: saltPct,
        oil: oilPct,
        sugar: Math.round(sugarPct * 100) / 100,
        yeast: Math.round(yeastPct * 1000) / 1000,
        tempDesc,
        methodDesc
      };
    }

    function updateCalculator() {
      const count = Math.max(1, parseInt(inputs.numPizzas.value) || 1);
      const ballWeight = Math.max(50, parseFloat(inputs.weightPerBall.value) || 300);
      const hours = parseInt(inputs.fermentTime.value);

      // Kijelzők frissítése
      displays.numPizzas.textContent = `${count} db`;
      displays.weight.textContent = `${ballWeight} g`;
      displays.time.textContent = `${hours} óra`;

      const params = calculateParameters(hours);
      displays.notes.innerHTML = `${params.methodDesc}<br><span style="display:inline-block; margin-top:8px; color:#cbd5e1;">💧 <strong>Ajánlott vízhőmérséklet:</strong> ${params.tempDesc}</span>`;

      // Százalékok összege és liszttömeg számítása
      const totalPct = params.flour + params.water + params.salt + params.oil + params.sugar + params.yeast;
      const targetBatchWeight = count * ballWeight;
      const flourWeight = targetBatchWeight / (totalPct / 100);

      const ingredients = [
        { name: "Erős búzaliszt (W300+ / 12.5-13% prot.)", pct: params.flour, weight: flourWeight },
        { name: "Víz", pct: params.water, weight: flourWeight * (params.water / 100) },
        { name: "Só", pct: params.salt, weight: flourWeight * (params.salt / 100) },
        { name: "Olívaolaj", pct: params.oil, weight: flourWeight * (params.oil / 100) },
        { name: "Cukor / Maláta", pct: params.sugar, weight: flourWeight * (params.sugar / 100) },
        { name: "Instant élesztő (IDY)", pct: params.yeast, weight: flourWeight * (params.yeast / 100) }
      ];

      displays.body.innerHTML = "";
      let calculatedTotalWeight = 0;

      ingredients.forEach(item => {
        calculatedTotalWeight += item.weight;
        const tr = document.createElement("tr");

        // Formázás: 5g alatt 2 tizedesjegy (precíz élesztő méréshez), 15g alatt 1 tizedesjegy, felette kerekítés
        let formattedWeight = Math.round(item.weight) + " g";
        if (item.weight < 5) {
          formattedWeight = item.weight.toFixed(2) + " g";
        } else if (item.weight < 15) {
          formattedWeight = item.weight.toFixed(1) + " g";
        }

        tr.innerHTML = `
          <td>${item.name}</td>
          <td class="pct">${item.pct.toFixed(item.pct < 1 ? 2 : 1)}%</td>
          <td class="num">${formattedWeight}</td>
        `;
        displays.body.appendChild(tr);
      });

      displays.totalPct.textContent = `${totalPct.toFixed(1)}%`;
      displays.totalWeight.textContent = `${Math.round(calculatedTotalWeight)} g`;
    }

    inputs.numPizzas.addEventListener('input', updateCalculator);
    inputs.weightPerBall.addEventListener('input', updateCalculator);
    inputs.fermentTime.addEventListener('input', updateCalculator);

    updateCalculator();
  </script>
</body>
</html>
