<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NY Pizza Tésztakalkulátor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f97316;
      --accent-hover: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--accent);
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .val-display {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    input[type="number"],
    input[type="range"] {
      width: 100%;
    }

    input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .info-box {
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 24px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .info-box strong {
      color: var(--text);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    td.pct {
      text-align: right;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
    }

    tr.total-row td {
      border-bottom: none;
      border-top: 2px solid var(--border);
      font-weight: 700;
      color: var(--accent);
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>NY Pizza Kalkulátor</h1>
    <p class="subtitle">Dinamikus fermentációs receptúra New York stílushoz</p>

    <!-- Pizzák darabszáma -->
    <div class="form-group">
      <label for="numPizzas">Pizzák darabszáma: <span class="val-display" id="numPizzasDisplay">5 db</span></label>
      <input type="number" id="numPizzas" min="1" max="200" value="5">
    </div>

    <!-- Egy pizza súlya -->
    <div class="form-group">
      <label for="weightPerBall">Egy tésztagombóc súlya: <span class="val-display" id="weightDisplay">300 g</span></label>
      <input type="number" id="weightPerBall" min="150" max="600" step="10" value="300">
    </div>

    <!-- Érlelési idő csúszka -->
    <div class="form-group">
      <label for="fermentTime">Érlelési idő: <span class="val-display" id="timeDisplay">24 óra</span></label>
      <input type="range" id="fermentTime" min="2" max="72" step="1" value="24">
    </div>

    <!-- Technológiai visszajelzés -->
    <div class="info-box" id="processNotes">
      Betöltés...
    </div>

    <!-- Receptúratábla -->
    <table>
      <thead>
        <tr>
          <th>Alapanyag</th>
          <th style="text-align: right;">Baker's %</th>
          <th style="text-align: right;">Mennyiség</th>
        </tr>
      </thead>
      <tbody id="ingredientsBody">
        <!-- JS generálja -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td>Össztömeg</td>
          <td class="pct" id="totalPct">-</td>
          <td class="num" id="totalWeight">-</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    const inputs = {
      numPizzas: document.getElementById('numPizzas'),
      weightPerBall: document.getElementById('weightPerBall'),
      fermentTime: document.getElementById('fermentTime')
    };

    const displays = {
      numPizzas: document.getElementById('numPizzasDisplay'),
      weight: document.getElementById('weightDisplay'),
      time: document.getElementById('timeDisplay'),
      notes: document.getElementById('processNotes'),
      body: document.getElementById('ingredientsBody'),
      totalPct: document.getElementById('totalPct'),
      totalWeight: document.getElementById('totalWeight')
    };

    function calculateParameters(hours) {
      let yeastPct = 0.3;
      let sugarPct = 1.5;
      let hydration = 63.0;
      let tempDesc = "";
      let methodDesc = "";

      if (hours <= 4) {
        // Expressz kelesztés szobahőmérsékleten
        yeastPct = 1.3 - (hours - 2) * 0.25; // 2h: 1.3%, 3h: 1.05%, 4h: 0.8%
        sugarPct = 2.0;
        hydration = 62.0; // Picit zártabb, hogy a rövid sikér ne folyjon szét
        tempDesc = "Kézmeleg víz (32–35 °C)";
        methodDesc = "<strong>Szobahőmérsékletű gyorsérlelés:</strong> Meleg vizet használj. Dagasztás után 15 perc pihentetés, majd azonnali gombócozás és szobahőn (22–25 °C) kelesztés sütésig.";
      } else if (hours <= 8) {
        // Ugyancsak szobahő, de kényelmesebb
        yeastPct = 0.7 - (hours - 4) * 0.08; // ~0.7% -> ~0.38%
        sugarPct = 1.8;
        hydration = 62.5;
        tempDesc = "Szobahőmérsékletű víz (20–22 °C)";
        methodDesc = "<strong>Napközbeni szobahőmérsékletű kelesztés:</strong> 1-2 óra bulk kelesztés után gombócozd ki, és lefedve tartsd szobahőn a sütés pillanatáig.";
      } else if (hours <= 24) {
        // Klasszikus 12-24 órás hűtős fermentáció
        // 12h: ~0.45%, 24h: 0.30%
        yeastPct = 0.45 - ((hours - 12) / 12) * 0.15;
        sugarPct = 1.5;
        hydration = 63.0;
        tempDesc = "Hideg víz (10–14 °C)";
        methodDesc = "<strong>Hideg érlelés (hűtőben 4 °C-on):</strong> Dagasztás után 30–45 perc szobahőn (bulk), gombócozás, majd hűtő. <em>Fontos: Sütés előtt 2 órával vedd ki szobahőre temperálódni!</em>";
      } else {
        // Hosszú 24-72 órás hideg fermentáció
        // 24h: 0.30%, 72h: 0.15%
        yeastPct = 0.30 - ((hours - 24) / 48) * 0.15;
        sugarPct = 1.2 - ((hours - 24) / 48) * 0.2; // A hosszas enzimaktivitás miatt kevesebb hozzáadott cukor is elég
        hydration = 63.5;
        tempDesc = "Nagyon hideg víz (4–8 °C)";
        methodDesc = "<strong>Hosszú hideg érlelés (hűtőben 3–4 °C-on):</strong> Minimális élesztő, lassú enzimatikus cukorbontás és erős gluténstruktúra. <em>Sütés előtt 2,5–3 órával temperáld!</em>";
      }

      return {
        flour: 100.0,
        water: hydration,
        salt: 2.5,
        oil: 2.5,
        sugar: Math.round(sugarPct * 100) / 100,
        yeast: Math.round(yeastPct * 1000) / 1000,
        tempDesc,
        methodDesc
      };
    }

    function updateCalculator() {
      const count = Math.max(1, parseInt(inputs.numPizzas.value) || 1);
      const ballWeight = Math.max(50, parseFloat(inputs.weightPerBall.value) || 300);
      const hours = parseInt(inputs.fermentTime.value);

      // Kijelzők frissítése
      displays.numPizzas.textContent = `${count} db`;
      displays.weight.textContent = `${ballWeight} g`;
      displays.time.textContent = `${hours} óra`;

      const params = calculateParameters(hours);
      displays.notes.innerHTML = `${params.methodDesc}<br><span style="display:inline-block; margin-top:6px; color:#cbd5e1;">💧 <strong>Ajánlott vízhőmérséklet:</strong> ${params.tempDesc}</span>`;

      // Százalékok összege
      const totalPct = params.flour + params.water + params.salt + params.oil + params.sugar + params.yeast;
      const targetBatchWeight = count * ballWeight;
      const flourWeight = targetBatchWeight / (totalPct / 100);

      const ingredients = [
        { name: "Erős búzaliszt (W300+ / 12.5-13% prot.)", pct: params.flour, weight: flourWeight },
        { name: "Víz", pct: params.water, weight: flourWeight * (params.water / 100) },
        { name: "Só", pct: params.salt, weight: flourWeight * (params.salt / 100) },
        { name: "Olívaolaj", pct: params.oil, weight: flourWeight * (params.oil / 100) },
        { name: "Cukor / Maláta", pct: params.sugar, weight: flourWeight * (params.sugar / 100) },
        { name: "Instant élesztő (IDY)", pct: params.yeast, weight: flourWeight * (params.yeast / 100) }
      ];

      displays.body.innerHTML = "";
      let calculatedTotalWeight = 0;

      ingredients.forEach(item => {
        calculatedTotalWeight += item.weight;
        const tr = document.createElement("tr");
        
        // Formázási logika: 10g alatt 1 tizedesjegy a pontosságért (só, élesztő)
        const formattedWeight = item.weight < 15 
          ? item.weight.toFixed(1) + " g" 
          : Math.round(item.weight) + " g";

        tr.innerHTML = `
          <td>${item.name}</td>
          <td class="pct">${item.pct.toFixed(item.pct < 1 ? 2 : 1)}%</td>
          <td class="num">${formattedWeight}</td>
        `;
        displays.body.appendChild(tr);
      });

      displays.totalPct.textContent = `${totalPct.toFixed(1)}%`;
      displays.totalWeight.textContent = `${Math.round(calculatedTotalWeight)} g`;
    }

    inputs.numPizzas.addEventListener('input', updateCalculator);
    inputs.weightPerBall.addEventListener('input', updateCalculator);
    inputs.fermentTime.addEventListener('input', updateCalculator);

    updateCalculator();
  </script>
</body>
</html>
